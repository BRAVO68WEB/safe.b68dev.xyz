name: build

on:
  push:
    branches:
      - safe.fiery.me
    paths:
      - 'src/**/*.css'
      - 'src/**/*.js'
      - 'src/**/*.scss'
      - 'src/versions.json'

env:
  NODE_VERSION: 20

jobs:
  build:
    name: Rebuild client assets and bump v1 version string
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-nodemodules
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-nodemodules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Update browserslist/caniuse-lite
        run: npx browserslist@latest --update-db

      - name: Build
        run: pnpm build

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'dist: rebuilt client assets and bumped v1 version string'
          commit_user_name: loli-bot
          commit_user_email: hi@fiery.me
        env:
          CI: true
